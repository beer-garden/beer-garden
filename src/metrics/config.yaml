auth:
  authentication_handlers:
    basic:
      enabled: true
    ldap:
      base_dn: dc=example,dc=org
      default_user_roles:
      - read_only
      enabled: false
      host: localhost
      port: 389
      roles_search_base: dc=example,dc=org
      use_full_user_dn: false
      use_ssl: false
      user_attributes: cn=users,cn=accounts
      user_prefix: uid
    trusted_header:
      create_users: true
      enabled: false
      user_alias_mapping_header: bg-user-alias-mapping
      user_local_roles_header: bg-user-local-roles
      user_upstream_roles_header: bg-user-upstream-roles
      username_header: bg-username
  default_admin:
    password: password
    username: admin
  enabled: false
  role_definition_file: null
  token_access_ttl:
    garden_admin: 15
    operator: 15
    plugin_admin: 15
    read_only: 15
  token_refresh_ttl:
    garden_admin: 720
    operator: 720
    plugin_admin: 720
    read_only: 720
  token_secret: ''
  user_definition_file: null
children:
  directory: ./children
db:
  connection:
    authentication_source: admin
    host: localhost
    password: null
    port: 27017
    username: null
  name: beer_garden
  prune:
    batch_size: -1
    in_progress_request_expiration: 180
    interval: 15
    ttl:
      action: -1
      file: 15
      info: 15
entry:
  http:
    enabled: true
    host: 0.0.0.0
    port: 2337
    ssl:
      ca_cert: null
      ca_path: null
      client_cert_verify: NONE
      enabled: false
      private_key: null
      public_key: null
    url_prefix: /
  stomp:
    enabled: false
    headers: []
    host: localhost
    password: null
    port: 61613
    send_destination: null
    ssl:
      ca_cert: null
      client_cert: null
      client_key: null
      use_ssl: false
    subscribe_destination: null
    username: null
garden:
  name: default
  status_history: 5
log:
  config_file: null
  fallback_file: null
  fallback_level: INFO
metrics:
  elastic:
    enabled: false
    url: null
  prometheus:
    enabled: false
    host: 0.0.0.0
    port: 2338
    url: null
mq:
  admin_queue_expiry: 3600000
  blocked_connection_timeout: 5
  connection_attempts: 3
  connections:
    admin:
      password: guest
      port: 15672
      ssl:
        ca_cert: null
        ca_verify: true
        client_cert: null
        enabled: false
      user: guest
    message:
      password: guest
      port: 5672
      ssl:
        ca_cert: null
        ca_verify: true
        client_cert: null
        enabled: false
      user: guest
  exchange: beer_garden
  heartbeat_interval: 3600
  host: localhost
  virtual_host: /
parent:
  http:
    access_token: null
    api_version: 1
    client_timeout: -1
    enabled: false
    host: null
    password: null
    port: 2337
    refresh_token: null
    ssl:
      ca_cert: null
      ca_verify: true
      client_cert: null
      client_key: null
      enabled: false
    url_prefix: /
    username: null
  skip_events: []
  stomp:
    enabled: false
    headers: []
    host: localhost
    password: null
    port: 61613
    send_destination: null
    ssl:
      ca_cert: null
      client_cert: null
      client_key: null
      use_ssl: false
    subscribe_destination: null
    username: null
  sync_interval: 15
plugin:
  allow_command_updates: false
  local:
    auth:
      password: password
      username: plugin_admin
    capture_streams: false
    directory: null
    host_env_vars: []
    logging:
      config_file: null
      fallback_level: INFO
    max_concurrent: 5
    timeout:
      shutdown: 10
      startup: 5
  mq:
    host: localhost
  remote:
    logging:
      config_file: null
      fallback_level: INFO
  status_heartbeat: 10
  status_history: 5
  status_timeout: 30
replication:
  enabled: false
request_validation:
  dynamic_choices:
    command:
      timeout: 10
    url:
      ca_cert: null
      ca_verify: true
scheduler:
  job_defaults:
    coalesce: true
    max_instances: 3
  job_startup_file: ./scheduled_jobs.json
  max_workers: 10
ui:
  auto_refresh: false
  cors_enabled: true
  debug_mode: false
  execute_javascript: false
  icon_default: fa-beer
  name: Beer Garden
  search_delay: 400
