version: '3.5'

services:
  metrics-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrics-server
    networks:
      - bg-network
    ports:
      - "8001:8001"
    environment:
      BG_DB_CONNECTION_HOST: "localhost"
      BG_DB_CONNECTION_PORT: "27017"
    restart: unless-stopped

networks:
  bg-network:
    external: true   