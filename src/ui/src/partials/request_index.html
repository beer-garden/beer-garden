<h1 class="page-header">Requests</h1>

<fetch-data response="response" hide="empty" ng-if="hasPermission('READ_ONLY')"></fetch-data>

<div ng-if="!hasPermission('READ_ONLY')">
  <h1>
    <span>401: Unauthorized. You are not authorized to access this page.</span>
  </h1>
</div>

<div
  class="container-fluid animate-if"
  ng-show="hasPermission('READ_ONLY') && (responseState(response) === 'success' ||
       responseState(response) === 'empty')"
  style="padding-bottom: 3rem"
>
  <table
    id="requestIndexTable"
    datatable=""
    dt-options="dtOptions"
    dt-columns="dtColumns"
    dt-instance="instanceCreated"
    class="table table-striped table-bordered w-100"
  />
</div>
