<h1 class="page-header">Topics Management
  <span class="pull-right">
    <button
      type="button"
      class="btn btn-primary"
      ng-click="doSync()"
      ng-if="hasPermission('GARDEN_ADMIN', true)"
    >
      Sync Topics
    </button>
    <button
      type="button"
      class="btn btn-primary"
      ng-click="doCreate()"
      ng-if="hasPermission('GARDEN_ADMIN', true)"
    >
      Create Topic
    </button>
  </span>
</h1>

<fetch-data response="response" hide="empty"></fetch-data>

<div
  class="container-fluid animate-if"
  ng-show="responseState(response) === 'success' ||
       responseState(response) === 'empty'"
  style="padding-bottom: 3rem"
>
  <table
    id="topicIndexTable"
    datatable=""
    dt-options="dtOptions"
    dt-columns="dtColumns"
    dt-instance="instanceCreated"
    class="table table-striped table-bordered w-100"
  />
</div>
