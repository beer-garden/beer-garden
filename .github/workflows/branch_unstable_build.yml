name: Branch Unstable Push

on: workflow_dispatch

jobs:

  docker-branch-publish-src-unstable:
    name: Docker Publish Python ${{ matrix.python-version }} Latest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    defaults:
      run:
        working-directory: ./src/app

    steps:
      - uses: actions/checkout@v3

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Install Dependencies 
        run: make deps    

      - name: Build and Publish Unstable Images
        run: make publish-branch-docker-unstable PYTHON_VERSION=${{ matrix.python-version }}

  docker-publish-ui-unstable:
    name: Docker Publish UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Publish Images
        run: make deps publish-branch-docker-unstable

  docker-publish-ui-react-unstable:
    name: Docker Publish UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/react

    steps:
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Publish Images
        run: make deps publish-branch-docker-unstable

  docker-branch-publish-src-unstable-rpm:
    name: Docker Publish Python ${{ matrix.python-version }}-${{ matrix.dist }} Unstable Branch
    runs-on: ubuntu-latest
    needs: [docker-branch-publish-src-unstable]

    strategy:
      fail-fast: false
      matrix:
        dist: ["centos7", "rocky9"]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v3

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }} 

      - name: Install Dependencies 
        run: make deps    
        working-directory: ./src/app

      - name: Copy Brewtils
        run: cp -r ./app/src/brewtils brewtils
        working-directory: ./src

      - name: Build and Publish Unstable Images
        run: make publish-docker-unstable-branch-rpm PYTHON_VERSION=${{ matrix.python-version }} DIST=${{ matrix.dist }}