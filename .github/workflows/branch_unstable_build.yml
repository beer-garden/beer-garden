name: Branch Unstable Push

on: workflow_dispatch

jobs:

  docker-branch-publish-src-unstable:
    name: Docker Publish Python ${{ matrix.python-version }} Latest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: ./src/app

    steps:
      - uses: actions/checkout@v3

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Install Dependencies 
        run: make deps    

      - name: Build and Publish Unstable Images
        run: make publish-branch-docker-unstable PYTHON_VERSION=${{ matrix.python-version }}

  docker-publish-ui-unstable:
    name: Docker Publish UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Publish Images
        run: make deps publish-branch-docker-unstable
