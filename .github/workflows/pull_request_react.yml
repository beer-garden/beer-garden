name: Pull Request -- React

on: 
  pull_request:
    paths:
      - 'src/react/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  UILinting:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest"]
        node: ["20"]

    name: UI Linting OS ${{ matrix.os }} - Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}

      - name: Install Dependencies
        run: npm install
        working-directory: ./src/react

      - name: Run Tests
        run: make lint
        working-directory: ./src/react

  Vitest:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest"]

    name: Vitest OS ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: make test_docker_image
        working-directory: ./src/react
      
      - name: Run Tests
        run: make test
        working-directory: ./src/react