name: Pull Request

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Linting:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./src/app

    strategy:
      matrix:
        python-version: ["3.11.13"]
        os: ["ubuntu-latest"]

    name: Linting OS ${{ matrix.os }} - Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Custom tag extractor to find Brewtils Branch
      - name: Find Brewtils Branch
        uses: TheBurchLog/body-env-tag-action@1.0
        with:
          tag: "brewtils:"
          env-variable: "brewtils"
          default-value: "develop"
          tag-position: -1

      # Used the hashtag here instead of slash allow for branches to have slashes in them
      - name: Update Brewtils Branch
        run: sed -i 's#brewtils@develop#brewtils@${{env.brewtils}}#g' requirements-dev.txt

      # Allows for brewtils to upgrade deps that don't match with current released version of brewtils 
      - name: Remove Brewtils from requirements.txt
        run: sed -i '/brewtils/d' requirements.txt
        working-directory: ./src/app

      # Need to update if we support other OS's
      - name: Cache PIP Install
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-pip-lint-${{ hashFiles('**/setup.py') }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-pip-lint

      - name: Run Linting (src/app)
        run: |
          pip install -r requirements-dev.txt
          make lint

      - name: Run Linting (test/integration)
        working-directory: ./test/integration
        run: make lint

  PyTest:
    runs-on: ${{ matrix.os }}

    env:
      brewtils: "develop"

    defaults:
      run:
        working-directory: ./src/app

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.13","3.12","3.13", "3.14"]
        os: ["ubuntu-latest"]

    name: PyTests Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Custom tag extractor to find Brewtils Branch
      - name: Find Brewtils Branch
        uses: TheBurchLog/body-env-tag-action@1.0
        with:
          tag: "brewtils:"
          env-variable: "brewtils"
          default-value: "develop"
          tag-position: -1

      # Something happened with setuptools 82.0.0 that causes pip install to fail, so we are downgrading to 81 for now until we can figure out the issue
      - name: Downgrade Setup Tools
        run: python -m pip install --upgrade pip setuptools==81

      # Used the hashtag here instead of slash allow for branches to have slashes in them
      - name: Update Brewtils Branch
        run: sed -i 's#brewtils@develop#brewtils@${{env.brewtils}}#g' requirements-dev.txt

      # Allows for brewtils to upgrade deps that don't match with current released version of brewtils 
      - name: Remove Brewtils from requirements.txt
        run: sed -i '/brewtils/d' requirements.txt
        working-directory: ./src/app

      # Need to update if we support other OS's
      - name: Cache PIP Install
        uses: actions/cache@v4
        if: env.brewtils == 'develop'
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-pip-install-${{ hashFiles('**/setup.py') }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-pip-install-

      - name: Make Deps
        run: make deps

      - name: Run Tests
        run: make test

  PyTest-Mongodb:
    runs-on: ${{ matrix.os }}
    needs: PyTest

    env:
      brewtils: "develop"

    defaults:
      run:
        working-directory: ./src/app

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: ["ubuntu-latest"]
        mongodb-version: ["4.2", "5.0", "6.0", "7.0","8.0", "8.2", "latest"]

    name: PyTests Python ${{ matrix.python-version }} - Mongodb ${{ matrix.mongodb-version }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set Mongodb ENV Version
        run: echo "MONGODB_VERSION=${{ matrix.mongodb-version }}" >> $GITHUB_ENV  
        shell: bash

      # Custom tag extractor to find Brewtils Branch
      - name: Find Brewtils Branch
        uses: TheBurchLog/body-env-tag-action@1.0
        with:
          tag: "brewtils:"
          env-variable: "brewtils"
          default-value: "develop"
          tag-position: -1

      # Used the hashtag here instead of slash allow for branches to have slashes in them
      - name: Update Brewtils Branch
        run: sed -i 's#brewtils@develop#brewtils@${{env.brewtils}}#g' requirements-dev.txt

      # Allows for brewtils to upgrade deps that don't match with current released version of brewtils 
      - name: Remove Brewtils from requirements.txt
        run: sed -i '/brewtils/d' requirements.txt
        working-directory: ./src/app

      # Something happened with setuptools 82.0.0 that causes pip install to fail, so we are downgrading to 81 for now until we can figure out the issue
      - name: Downgrade Setup Tools
        run: python -m pip install --upgrade pip setuptools==81

      # Need to update if we support other OS's
      - name: Cache PIP Install
        uses: actions/cache@v4
        if: env.brewtils == 'develop'
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-pip-install-${{ hashFiles('**/setup.py') }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-pip-install-

      - name: Make Deps
        run: make deps

      - name: Run Tests
        run: make test

  CodeCoverage:
    runs-on: ${{ matrix.os }}
    needs: PyTest

    defaults:
      run:
        working-directory: ./src/app

    strategy:
      matrix:
        python-version: ["3.11"]
        os: ["ubuntu-latest"]

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}

    name: Code Coverage OS ${{ matrix.os }} - Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Custom tag extractor to find Brewtils Branch
      - name: Find Brewtils Branch
        uses: TheBurchLog/body-env-tag-action@1.0
        with:
          tag: "brewtils:"
          env-variable: "brewtils"
          default-value: "develop"
          tag-position: -1

      # Used the hashtag here instead of slash allow for branches to have slashes in them
      - name: Update Brewtils Branch
        run: sed -i 's#brewtils@develop#brewtils@${{env.brewtils}}#g' requirements-dev.txt

      # Allows for brewtils to upgrade deps that don't match with current released version of brewtils 
      - name: Remove Brewtils from requirements.txt
        run: sed -i '/brewtils/d' requirements.txt
        working-directory: ./src/app

      # Need to update if we support other OS's
      - name: Cache PIP Install
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-pip-coverage-${{ hashFiles('**/setup.py') }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-pip-coverage

      - name: Make Deps
        run: |
          make deps
          pip install pytest
          pip install pytest-cov

      - name: Generate coverage report
        run: |
          coverage run --source beer_garden -m pytest test --tb=no --ignore test/api/http/unit/handlers/v1/event_test.py
          coverage report -m
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  SecurityCheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        python-version: ["3.12"]
        os: ["ubuntu-latest"]

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}

    name: Code Security Check OS ${{ matrix.os }} - Python ${{ matrix.python-version }}
    steps:
      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Make Deps
        run: |
          python -m pip install --upgrade pip
          pip install "importlib-metadata<5" bandit

      - uses: actions/checkout@v3
        with:
          ref: ${{ github.base_ref }}
          path: ./old

      - uses: actions/checkout@v3
        with:
          path: ./new

      - name: Scan old security
        working-directory: ./old/src/app
        continue-on-error: true
        run: |
          bandit --format json -o ~/old_bandit.json -r beer_garden

      - name: Scan new security
        working-directory: ./new/src/app
        run: |
          bandit --baseline ~/old_bandit.json -r beer_garden

  Local-Plugin-Testing:
    runs-on: ${{ matrix.os }}
    needs: PyTest

    strategy:
      matrix:
        python-version: ["3.11.13","3.12","3.13", "3.14"]
        os: ["ubuntu-latest"]
      fail-fast: false

    name: Local Plugins - Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v2

      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      # Custom tag extractor to find Brewtils Branch
      - name: Find Brewtils Branch
        uses: TheBurchLog/body-env-tag-action@1.0
        with:
          tag: "brewtils:"
          env-variable: "brewtils"
          default-value: "develop"
          tag-position: -1

      # Used the hashtag here instead of slash allow for branches to have slashes in them
      - name: Update Brewtils Branch
        run: sed -i 's#brewtils@develop#brewtils@${{env.brewtils}}#g' requirements-dev.txt
        working-directory: ./src/app

      # Allows for brewtils to upgrade deps that don't match with current released version of brewtils 
      - name: Remove Brewtils from requirements.txt
        run: sed -i '/brewtils/d' requirements.txt
        working-directory: ./src/app

      - name: Build Local Beer Garden Docker
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install setuptools wheel
          make package
          make clean-python
          docker build -t bgio/beer-garden:unstable -f docker/Dockerfile.unstable --build-arg PYTHON_IMAGE=python:${{ matrix.python-version }}-slim .
        working-directory: ./src/app

      - name: Update Docker Compose
        run: cp test/conf/docker-compose.yml docker/docker-compose/docker-compose.yml
        working-directory: ./

      - name: Checkout Local Plugins
        uses: actions/checkout@v2
        with:
          repository: beer-garden/example-plugins
          path: ./docker/docker-compose/data/localplugins

      - name: Verify Local Plugins
        run: ls ./docker/docker-compose/data/localplugins

      - name: Run Docker Mongodb and RabbitMQ
        run: docker compose up -d mongodb rabbitmq
        working-directory: ./docker/docker-compose

      - name: Wait for Mongodb and RabbitMQ to start
        run: sleep 20s
        shell: bash

      - name: Run Docker Beer Garden
        run: BG='unstable' docker compose up -d beer-garden
        working-directory: ./docker/docker-compose

      - name: Wait for Beer Garden to start
        run: sleep 60s
        shell: bash

      - name: Grab logs from Beer-Garden
        run: BG='unstable' docker compose logs --tail 100 beer-garden
        working-directory: ./docker/docker-compose

      - name: Check If Beer Garden is Operational
        uses: nick-invision/retry@v2
        with:
          timeout_seconds: 30
          max_attempts: 20
          retry_on: error
          retry_wait_seconds: 5
          command: curl http://localhost:2337/config

      - name: Run Topic Sync
        run: curl -X PATCH --data-raw '{"operations":[{"operation":"sync_all_topics"}]}' http://localhost:2337/api/v1/topics 

      - name: Grab logs from Beer-Garden
        run: BG='unstable' docker compose logs --tail 100 beer-garden
        working-directory: ./docker/docker-compose

      - name: Install Develop Version of Brewtils
        run: pip3 install -e git+https://github.com/beer-garden/brewtils@${{env.brewtils}}#egg=brewtils

      - name: Install Testing Dependencies
        run: pip3 install -r requirements.txt
        working-directory: ./test/integration

      - name: Test Plugins
        run: python3 -m pytest local_plugins/
        working-directory: ./test/integration

      - name: Grab logs from Beer-Garden
        if: always()
        run: BG='unstable' docker compose logs --tail 1000 beer-garden
        working-directory: ./docker/docker-compose

      - name: Shutdown Docker Containers
        run: docker compose stop
        working-directory: ./docker/docker-compose

  Grandchild-Testing:
    runs-on: ${{ matrix.os }}
    needs: PyTest

    strategy:
      matrix:
        python-version: ["3.12"]
        os: ["ubuntu-latest"]
        child:
          - "unstable"
          - "3.19.1"
          - "3.20.0"
          # - "3.21.0"
          - "3.22.0"
          - "3.23.1"
          - "3.24.4"
          - "3.25.1"
          - "3.26.4"
          - "3.27.2-python3.11"
          - "3.28.2-python3.11"
          - "3.29.1-python3.11"
          - "3.30.1"
          - "3.31.0"
          - "3.32.0"
          - "3.33.0"
        parent: ["unstable"]
      fail-fast: false

    name: Grandchild Test - unstable -> ${{ matrix.parent }} -> ${{ matrix.child }} - Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v2

      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      # Custom tag extractor to find Brewtils Branch
      - name: Find Brewtils Branch
        uses: TheBurchLog/body-env-tag-action@1.0
        with:
          tag: "brewtils:"
          env-variable: "brewtils"
          default-value: "develop"
          tag-position: -1

      # Used the hashtag here instead of slash allow for branches to have slashes in them
      - name: Update Brewtils Branch
        run: sed -i 's#brewtils@develop#brewtils@${{env.brewtils}}#g' requirements-dev.txt
        working-directory: ./src/app

      # Allows for brewtils to upgrade deps that don't match with current released version of brewtils 
      - name: Remove Brewtils from requirements.txt
        run: sed -i '/brewtils/d' requirements.txt
        working-directory: ./src/app

      - name: Build Beer Garden Docker
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install setuptools wheel
          make package
          make clean-python
          docker build -t bgio/beer-garden:unstable -f docker/Dockerfile.unstable --build-arg PYTHON_IMAGE=python:${{ matrix.python-version }}-slim .
          docker tag bgio/beer-garden:unstable bgio/beer-garden:grandparent
          if [ "${{ matrix.parent }}" != "unstable" ]; then
            docker pull bgio/beer-garden:${{ matrix.parent }}
          fi
          docker tag bgio/beer-garden:${{ matrix.parent }} bgio/beer-garden:parent
          if [ "${{ matrix.child }}" != "unstable" ]; then
            docker pull bgio/beer-garden:${{ matrix.child }}
          fi
          docker tag bgio/beer-garden:${{ matrix.child }} bgio/beer-garden:child
        working-directory: ./src/app

      - name: Update Docker Compose  
        run: |
          cp test/conf/docker-compose-grandparents-test.yml docker/docker-compose/docker-compose.yml
          cp -r test/conf/beer_garden_grandparent_children docker/docker-compose/
          cp -r test/conf/beer_garden_parent_children docker/docker-compose/
        working-directory: ./

      - name: Checkout Local Plugins
        uses: actions/checkout@v2
        with:
          repository: beer-garden/example-plugins
          path: ./docker/docker-compose/data/localplugins

      - name: Verify Local Plugins
        run: ls ./docker/docker-compose/data/localplugins

      - name: Run Docker Services
        run: docker compose up -d activemq mongodb rabbitmq
        working-directory: ./docker/docker-compose

      - name: Wait for required services
        run: sleep 30s
        shell: bash

      - name: Run Docker Beer Garden Grandparent
        run: docker compose up -d beer-garden-grandparent
        working-directory: ./docker/docker-compose

      - name: Check Docker
        run: docker ps

      - name: Check If Beer Garden Grandparent is Operational
        uses: nick-invision/retry@v2
        with:
          timeout_seconds: 30
          max_attempts: 20
          retry_on: error
          retry_wait_seconds: 5
          command: curl http://localhost:2337/config

      - name: Run Docker Beer Garden Parent
        run: docker compose up -d beer-garden-parent
        working-directory: ./docker/docker-compose

      - name: Check If Beer Garden Parent is Operational
        uses: nick-invision/retry@v2
        with:
          timeout_seconds: 30
          max_attempts: 20
          retry_on: error
          retry_wait_seconds: 5
          command: curl http://localhost:2347/config

      - name: Run Docker Beer Garden Child
        run: docker compose up -d beer-garden-child
        working-directory: ./docker/docker-compose

      - name: Check If Beer Garden Child is Operational
        uses: nick-invision/retry@v2
        with:
          timeout_seconds: 30
          max_attempts: 20
          retry_on: error
          retry_wait_seconds: 5
          command: curl http://localhost:2357/config

      - name: Wait for Garden Syncs
        run: sleep 120s
        shell: bash

      - name: Grab logs from Child
        if: always()
        run: docker compose logs --tail 3000 beer-garden-child
        working-directory: ./docker/docker-compose

      - name: Grab logs from Parent
        if: always()
        run: docker compose logs --tail 3000 beer-garden-parent
        working-directory: ./docker/docker-compose

      - name: Grab logs from Grand Parent
        if: always()
        run: docker compose logs --tail 3000 beer-garden-grandparent
        working-directory: ./docker/docker-compose

      - name: Install Develop Version of Brewtils
        run: pip${{ matrix.python-version }} install -e git+https://github.com/beer-garden/brewtils@${{env.brewtils}}#egg=brewtils

      - name: Install Testing Dependencies
        run: pip${{ matrix.python-version }} install -r requirements.txt
        working-directory: ./test/integration

      - name: Test Plugins
        run: python${{ matrix.python-version }} -m pytest grandparents_garden/
        working-directory: ./test/integration

      - name: Grab logs from Child
        if: always()
        run: docker compose logs --tail 3000 beer-garden-child
        working-directory: ./docker/docker-compose

      - name: Grab logs from Parent
        if: always()
        run: docker compose logs --tail 3000 beer-garden-parent
        working-directory: ./docker/docker-compose

      - name: Grab logs from Grand Parent
        if: always()
        run: docker compose logs --tail 3000 beer-garden-grandparent
        working-directory: ./docker/docker-compose

      - name: Print Grandparent Garden Database
        if: always()
        run: docker exec $(docker ps --filter "name=mongodb" --format "{{.Names}}") mongosh --eval "db.getSiblingDB('grandparent').garden.find({})"
        shell: bash

      - name: Print Parent Garden Database
        if: always()
        run: docker exec $(docker ps --filter "name=mongodb" --format "{{.Names}}") mongosh --eval "db.getSiblingDB('parent').garden.find({})"
        shell: bash

      - name: Print Child Garden Database
        if: always()
        run: docker exec $(docker ps --filter "name=mongodb" --format "{{.Names}}") mongosh --eval "db.getSiblingDB('child').garden.find({})"
        shell: bash

      - name: Print Grandparent Request Database
        if: always()
        run: docker exec $(docker ps --filter "name=mongodb" --format "{{.Names}}") mongosh --eval "db.getSiblingDB('grandparent').request.find({})"
        shell: bash

      - name: Print Parent Request Database
        if: always()
        run: docker exec $(docker ps --filter "name=mongodb" --format "{{.Names}}") mongosh --eval "db.getSiblingDB('parent').request.find({})"
        shell: bash

      - name: Print Child Request Database
        if: always()
        run: docker exec $(docker ps --filter "name=mongodb" --format "{{.Names}}") mongosh --eval "db.getSiblingDB('child').request.find({})"
        shell: bash


  Replication-Testing:
    runs-on: ${{ matrix.os }}
    needs: PyTest

    strategy:
      matrix:
        python-version: ["3.12"]
        os: ["ubuntu-latest"]
      fail-fast: false

    name: Replicaiton Testing - Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v2

      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      # Custom tag extractor to find Brewtils Branch
      - name: Find Brewtils Branch
        uses: TheBurchLog/body-env-tag-action@1.0
        with:
          tag: "brewtils:"
          env-variable: "brewtils"
          default-value: "develop"
          tag-position: -1

      # Used the hashtag here instead of slash allow for branches to have slashes in them
      - name: Update Brewtils Branch
        run: sed -i 's#brewtils@develop#brewtils@${{env.brewtils}}#g' requirements-dev.txt
        working-directory: ./src/app

      # Allows for brewtils to upgrade deps that don't match with current released version of brewtils 
      - name: Remove Brewtils from requirements.txt
        run: sed -i '/brewtils/d' requirements.txt
        working-directory: ./src/app

      - name: Build Local Beer Garden Docker
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install setuptools wheel
          make package
          make clean-python
          docker build -t bgio/beer-garden:test -f docker/Dockerfile.unstable --build-arg PYTHON_IMAGE=python:${{ matrix.python-version }}-slim .
        working-directory: ./src/app

      - name: Start Docker Swarm
        run: docker swarm init

      - name: Run Docker RabbitMQ and Mongodb
        run: docker stack deploy -c docker-compose-support.yml bg_core
        working-directory: ./test/conf/swarm/

      - name: Wait for Mongodb and RabbitMQ to start
        run: sleep 20s
        shell: bash

      - name: Copy Data Files
        run: cp -r docker/docker-compose/data test/conf/swarm/
        working-directory: ./
      
      - name: Check Data Files
        run: ls test/conf/swarm/data/certs/
        working-directory: ./

      - name: Run Docker Beer Garden
        run: docker stack deploy -c docker-compose-framework.yml beer-garden
        working-directory: ./test/conf/swarm/

      - name: Wait for Beer Garden to start
        run: sleep 60s
        shell: bash

      - name: Check services
        run: docker service ls

      - name: Check docker
        run: docker ps

      - name: Check BG
        run: docker service ps --no-trunc beer-garden_beer-garden

      - name: Check If Beer Garden is Operational
        uses: nick-invision/retry@v2
        with:
          timeout_seconds: 30
          max_attempts: 20
          retry_on: error
          retry_wait_seconds: 5
          command: curl http://127.0.0.1:2337/config

      - name: Grab logs from Beer-Garden.1
        if: always()
        run: docker logs --tail 3000 $(docker ps --filter name=beer-garden_beer-garden.1 --quiet | tail -1)

      - name: Grab logs from Beer-Garden.2
        if: always()
        run: docker logs --tail 3000 $(docker ps --filter name=beer-garden_beer-garden.2 --quiet | tail -1)

      - name: Grab logs from Beer-Garden.3
        if: always()
        run: docker logs --tail 3000 $(docker ps --filter name=beer-garden_beer-garden.3 --quiet | tail -1)

      # Uncomment if we want to start injecting latest brewtils for testing
      # - name: Install Brewtils
      #   run: pip${{ matrix.python-version }} install -e git+https://github.com/beer-garden/brewtils@${{env.brewtils}}#egg=brewtils
      #   working-directory: ./src/app

      # - name: show brewtils
      #   run: pip show brewtils

      # - name: Copy Brewtils Source
      #   run: cp -r $(pip show brewtils | grep 'location:' | sed 's/^.* //g')/brewtils ./test/conf/swarm/brewtils

      - name: Run Docker Beer Garden Plugins
        run: docker stack deploy -c docker-compose-plugins.yml beer-plugins
        working-directory: ./test/conf/swarm/

      - name: Wait for Plugins to start
        run: sleep 15s
        shell: bash

      - name: Grab Garden Info
        uses: nick-invision/retry@v2
        with:
          timeout_seconds: 30
          max_attempts: 20
          retry_on: error
          retry_wait_seconds: 10
          command: curl http://127.0.0.1:2337/api/v1/gardens/

      - name: Check services
        run: docker service ls

      - name: Check Publisher
        run: docker service ps --no-trunc beer-plugins_subscribe 
      
      - name: Grab logs from Publisher
        run: docker service logs --tail 100 beer-plugins_subscribe 

      - name: Grab logs from Beer-Garden
        if: always()
        run: docker service logs --tail 1000 beer-garden_beer-garden

      - name: Install Develop Version of Brewtils
        run: pip${{ matrix.python-version }} install -e git+https://github.com/beer-garden/brewtils@${{env.brewtils}}#egg=brewtils

      - name: Install Testing Dependencies
        run: pip${{ matrix.python-version }} install -r requirements.txt
        working-directory: ./test/integration

      - name: Check services
        run: docker service ls

      - name: Check Plugin Status
        run: |
          if docker service ls | grep -q "replicated   0/1        bgio/example-plugins:latest"; then
            exit 1
          fi
        shell: bash

      - name: Grab logs from Child
        if: failure()
        run: docker service logs --tail 100 beer-plugins_child 

      - name: Grab logs from Custom Display
        if: failure()
        run: docker service logs --tail 100 beer-plugins_custom-display

      - name: Grab logs from Echo
        if: failure()
        run: docker service logs --tail 100 beer-plugins_echo 

      - name: Grab logs from Echo Sleeper
        if: failure()
        run: docker service logs --tail 100 beer-plugins_echo-sleeper 

      - name: Grab logs from Error
        if: failure()
        run: docker service logs --tail 100 beer-plugins_error 

      - name: Grab logs from Nested Calls
        if: failure()
        run: docker service logs --tail 100 beer-plugins_nested-calls 

      - name: Grab logs from Parent
        if: failure()
        run: docker service logs --tail 100 beer-plugins_parent 

      - name: Grab logs from Publisher
        if: failure()
        run: docker service logs --tail 100 beer-plugins_publisher 

      - name: Grab logs from Sleeper
        if: failure()
        run: docker service logs --tail 100 beer-plugins_sleeper 

      - name: Grab logs from Sleeper Solo
        if: failure()
        run: docker service logs --tail 100 beer-plugins_sleeper-solo 

      - name: Grab logs from Subscriber
        if: failure()
        run: docker service logs --tail 100 beer-plugins_subscribe 

      - name: Test Plugins
        run: python${{ matrix.python-version }} -m pytest local_plugins --ignore=local_plugins/plugins/autobrew_test.py --ignore=local_plugins/plugins/complex_test.py --ignore=local_plugins/plugins/dynamic_test.py --ignore=local_plugins/plugins/requires_test.py --timeout=360
        working-directory: ./test/integration

      - name: Check docker
        if: always()
        run: docker ps

      - name: Check BG
        if: always()
        run: docker service ps --no-trunc beer-garden_beer-garden

      - name: Grab logs from Beer-Garden.1
        if: always()
        run: docker logs --tail 3000 $(docker ps --filter name=beer-garden_beer-garden.1 --quiet | tail -1)

      - name: Grab logs from Beer-Garden.2
        if: always()
        run: docker logs --tail 3000 $(docker ps --filter name=beer-garden_beer-garden.2 --quiet | tail -1)

      - name: Grab logs from Beer-Garden.3
        if: always()
        run: docker logs --tail 3000 $(docker ps --filter name=beer-garden_beer-garden.3 --quiet | tail -1)

  Migration-Testing:
    runs-on: ${{ matrix.os }}
    needs: PyTest

    strategy:
      matrix:
        python-version: ["3.11.13"]
        os: ["ubuntu-latest"]
        previous:
          - "unstable"
          - "3.0.5"
          - "3.1.1"
          - "3.2.3"
          - "3.3.0"
          - "3.4.0"
          - "3.5.0"
          - "3.6.0"
          # - "3.7.1" # Skipping 3.7.1 due to issues with starting image
          - "3.8.1"
          - "3.9.0"
          - "3.10.0"
          - "3.11.0"
          - "3.12.0"
          - "3.13.0"
          - "3.14.0"
          - "3.14.0"
          - "3.15.0"
          - "3.16.2"
          - "3.17.2"
          - "3.18.1"
          - "3.19.1"
          - "3.20.0"
          - "3.21.0"
          - "3.22.0"
          - "3.23.1"
          - "3.24.4"
          - "3.25.1"
          - "3.26.4"
          - "3.27.2-python3.11"
          - "3.28.2-python3.11"
          - "3.29.1-python3.11"
          - "3.30.1"
          - "3.31.0"
          - "3.32.0"
          - "3.33.0"
      fail-fast: false

    name: Migration Testing - ${{ matrix.previous }}
    steps:
      - uses: actions/checkout@v2

      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      # Custom tag extractor to find Brewtils Branch
      - name: Find Brewtils Branch
        uses: TheBurchLog/body-env-tag-action@1.0
        with:
          tag: "brewtils:"
          env-variable: "brewtils"
          default-value: "develop"
          tag-position: -1

      # Used the hashtag here instead of slash allow for branches to have slashes in them
      - name: Update Brewtils Branch
        run: sed -i 's#brewtils@develop#brewtils@${{env.brewtils}}#g' requirements-dev.txt
        working-directory: ./src/app

      # Allows for brewtils to upgrade deps that don't match with current released version of brewtils 
      - name: Remove Brewtils from requirements.txt
        run: sed -i '/brewtils/d' requirements.txt
        working-directory: ./src/app

      - name: Build Local Beer Garden Docker
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install setuptools wheel
          make package
          make clean-python
          docker build -t bgio/beer-garden:unstable -f docker/Dockerfile.unstable --build-arg PYTHON_IMAGE=python:${{ matrix.python-version }}-slim .
        working-directory: ./src/app

      - name: Update Docker Compose
        run: cp test/conf/docker-compose.yml docker/docker-compose/docker-compose.yml
        working-directory: ./

      - name: Checkout Local Plugins
        uses: actions/checkout@v2
        with:
          repository: beer-garden/example-plugins
          path: ./docker/docker-compose/data/localplugins

      - name: Verify Local Plugins
        run: ls ./docker/docker-compose/data/localplugins

      - name: Run Docker Mongodb and RabbitMQ
        run: docker compose up -d mongodb rabbitmq
        working-directory: ./docker/docker-compose

      - name: Wait for Mongodb and RabbitMQ to start
        run: sleep 20s
        shell: bash

      - name: Run Docker Beer Garden
        run: BG='${{ matrix.previous }}' docker compose up -d beer-garden
        working-directory: ./docker/docker-compose     

      - name: Check If Beer Garden is Operational
        uses: nick-invision/retry@v2
        with:
          timeout_seconds: 30
          max_attempts: 20
          retry_on: error
          retry_wait_seconds: 5
          command: curl http://localhost:2337/config

      - name: Wait for Beer Garden to start
        run: sleep 30s
        shell: bash

      - name: Grab logs from Beer-Garden
        if: always()
        run: BG='${{ matrix.previous }}' docker compose logs --tail 100 beer-garden
        working-directory: ./docker/docker-compose

      - name: Stop Docker Beer Garden
        run: BG='${{ matrix.previous }}' docker compose stop beer-garden
        working-directory: ./docker/docker-compose

      - name: Start Docker Beer Garden - Unstable 
        run: BG='unstable' docker compose up -d beer-garden
        working-directory: ./docker/docker-compose

      - name: Check If Beer Garden is Operational
        uses: nick-invision/retry@v2
        with:
          timeout_seconds: 30
          max_attempts: 20
          retry_on: error
          retry_wait_seconds: 5
          command: curl http://localhost:2337/config

      - name: Grab logs from Beer-Garden
        if: always()
        run: BG='unstable' docker compose logs --tail 1000 beer-garden
        working-directory: ./docker/docker-compose

      - name: Shutdown Docker Containers
        run: docker compose stop
        working-directory: ./docker/docker-compose

  JMeter-Testing:
    runs-on: ${{ matrix.os }}
    needs: Grandchild-Testing
    # Skipping the job until we can get this operational again
    if: false

    strategy:
      matrix:
        python-version: ["3.12"]
        os: ["ubuntu-latest"]
        child: ["unstable"]
      fail-fast: false

    name: JMeter Test - unstable -> ${{ matrix.child }}
    steps:
      - uses: actions/checkout@v2

      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      
      # Custom tag extractor to find Brewtils Branch
      - name: Find Brewtils Branch
        uses: TheBurchLog/body-env-tag-action@1.0
        with:
          tag: "brewtils:"
          env-variable: "brewtils"
          default-value: "develop"
          tag-position: -1

      # Used the hashtag here instead of slash allow for branches to have slashes in them
      - name: Update Brewtils Branch
        run: sed -i 's#brewtils@develop#brewtils@${{env.brewtils}}#g' requirements-dev.txt
        working-directory: ./src/app

      # Allows for brewtils to upgrade deps that don't match with current released version of brewtils 
      - name: Remove Brewtils from requirements.txt
        run: sed -i '/brewtils/d' requirements.txt
        working-directory: ./src/app

      - name: Build Beer Garden Docker
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install setuptools wheel
          make package
          make clean-python
          docker build -t bgio/beer-garden:unstable -f docker/Dockerfile.unstable --build-arg PYTHON_IMAGE=python:${{ matrix.python-version }}-slim .
          docker tag bgio/beer-garden:unstable bgio/beer-garden:parent
          if [ "${{ matrix.child }}" != "unstable" ]; then
            docker pull bgio/beer-garden:${{ matrix.child }}
          fi
          docker tag bgio/beer-garden:${{ matrix.child }} bgio/beer-garden:child
        working-directory: ./src/app

      - name: Update Docker Compose  
        run: |
          cp test/conf/docker-compose-jmeter-test.yml docker/docker-compose/docker-compose.yml
          cp -r test/conf/beer_garden_jmeter_parent_children docker/docker-compose/
          cp -r test/jmeter docker/docker-compose/data/

      - name: Start Docker Swarm
        run: docker swarm init

      - name: Make BG Network
        run: docker network create -d overlay --attachable bg-network

      - name: Run Docker Beer Garden Child
        run: docker compose up -d beer-garden-child
        working-directory: ./docker/docker-compose

      - name: Wait for Beer Garden Child to start
        run: sleep 10s
        shell: bash

      - name: Run Docker Beer Garden Parent
        run: docker compose up -d beer-garden-parent
        working-directory: ./docker/docker-compose

      - name: Wait for Beer Garden to start
        run: sleep 60s
        shell: bash

      - name: Check docker
        run: docker ps

      - name: Grab logs from Beer-Garden-Parent
        if: always()
        continue-on-error: true
        run: docker compose logs --tail 3000 beer-garden-parent
        working-directory: ./docker/docker-compose

      - name: Grab logs from Beer-Garden-Child
        if: always()
        continue-on-error: true
        run: docker compose logs --tail 3000 beer-garden-child
        working-directory: ./docker/docker-compose
      

      - name: Cache Mongo Database
        id: cache-mongo
        uses: actions/cache@v3
        with:
          # Use cache requests, if models have not been updated or database loader
          path: ./docker-compose_mongo-data
          key: ${{ runner.os }}-pr-stress-test-cache-${{ hashFiles('./src/app/beer_garden/db/mongo/models.py') }}-${{ hashFiles('./docker/docker-compose/data/jmeter/prep_database.jmx') }}

      - if: steps.cache-mongo.outputs.cache-hit == 'true'
        name: Move database file
        run: |
          sudo chown -R root:root ./docker-compose_mongo-data
          sudo mv ./docker-compose_mongo-data /var/lib/docker/volumes/docker-compose_mongo-data

      - name: Run Docker Beer Garden Plugins
        run: docker stack deploy -c docker-compose-plugins.yml beer-plugins
        working-directory: ./test/conf/jmeter_swarm/

      - name: Wait for Plugins to start
        run: sleep 60s
        shell: bash

      - name: Check services
        run: docker service ls

      - name: Create reports directory
        run: mkdir reports
        working-directory: ./docker/docker-compose/data

      - if: steps.cache-mongo.outputs.cache-hit != 'true'
        name: Pre-load database
        continue-on-error: false
        run: docker compose up jmeter-loader
        working-directory: ./docker/docker-compose

      - name: Run Jmeter Test
        id: jmeter
        run: |
          docker compose up jmeter-testing | tee jmeter.log
          echo "jmeter-rates=$(cat jmeter.log | grep 'summary' | tail -1 | cut -d '|' -f 2- | sed 's/^.*summary/summary/')\n" >> $GITHUB_OUTPUT         
        working-directory: ./docker/docker-compose

      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Jmeter Results:\n${{steps.jmeter.outputs.jmeter-rates}}'
            })

      - name: Upload JMeter Results
        uses: actions/upload-artifact@v3
        with:
          name: jmeter-html-reports
          path: docker/docker-compose/data/reports
          if-no-files-found: error

      - name: Check docker
        if: always()
        run: docker ps

      - name: Grab logs from Beer-Garden
        if: always()
        continue-on-error: true
        run: docker compose logs --tail 3000 beer-garden-parent

      - name: Grab logs from Beer-Garden-Child
        if: always()
        continue-on-error: true
        run: docker compose logs --tail 3000 beer-garden-child

      - if: steps.cache-mongo.outputs.cache-hit != 'true'
        name: Move database file
        continue-on-error: false
        run: |
          sudo mv -f /var/lib/docker/volumes/docker-compose_mongo-data ./docker-compose_mongo-data
          sudo chown -R $USER:$USER ./docker-compose_mongo-data
        
