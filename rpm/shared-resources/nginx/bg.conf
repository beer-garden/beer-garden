location /preview {
    client_max_body_size 100m;

    alias /opt/beer-garden/ui/preview/;
    try_files $uri $uri/ @beergardenpreview;
}

location /legacy {
    client_max_body_size 100m;

    alias /opt/beer-garden/ui/dist/;
    try_files $uri $uri/ @beergardenlegacy;
}

location / {
    client_max_body_size 100m;

    alias /opt/beer-garden/ui/dist/;
    try_files $uri $uri/ @beergarden;
}

location @beergarden {
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    # Ten Minute timeout for long-running requests
    proxy_read_timeout 600s;

    # Default values for Connect and Send timeouts are 60s
    proxy_send_timeout 60s;
    proxy_connect_timeout 60s;

    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_pass http://beer-garden;
}

# Redirects to @beergarden
location @beergardenpreview {
    rewrite ^/preview/(.*)$ /$1 permanent;
}

# Redirects to @beergarden
location @beergardenlegacy {
    rewrite ^/legacy/(.*)$ /$1 permanent;
}
